[build-system]
requires = [
    "hatchling>=1,<2",
    "iqm-hatch-plugins",
]
build-backend = "hatchling.build"

[project]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
description = "Set up and run QAOA experiments"
name = "iqm-qaoa"
readme = "build/README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "cvxpy<2,>=1.8",
    "dimod>=0.12.17",
    "iqm-client[qiskit]",
    "kahypar<2,>=1.3.7; platform_system != 'Windows'",
    "matplotlib<4.0,>=3.9.0",
    "networkx>=3.3",
    "numba>=0.61.0",
    "numpy<3.0,>=2.1",
    "optuna<5,>=4.8.0",
    "qiskit-aer>=0.14.2",
    "qiskit>=1.2.4",
    "quimb>=1.10.0",
    "requests<3.0,>=2.32.3",
    "scipy-stubs",
    "scipy>=1.13.0",
    "types-networkx",
]
authors = [
    { name = "IQM Finland Oy", email = "developers@iqm.tech" },
]
version = "2.0.0"

