[build-system]
requires = [
    "hatchling>=1,<2",
]
build-backend = "hatchling.build"

[project]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
description = "Python client for communicating with Station Control Service"
name = "iqm-station-control-client"
readme = "build/README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "grpcio<2,>=1.65.4",
    "iqm-data-definitions==2.24",
    "iqm-exa-common",
    "iqm-pulse",
    "opentelemetry-exporter-otlp<2,>=1.25.0",
    "pydantic<2.13.0,>=2.12.4",
    "pyyaml<7,>=6.0",
    "requests<3,>=2.32.3",
    "tqdm<5,>=4.59.0",
    "types-protobuf",
    "types-requests",
    "types-tqdm",
]
authors = [
    { name = "IQM Finland Oy", email = "info@iqm.tech" },
]
version = "13.0.1"

[project.license]
file = "LICENSE.txt"

[project.urls]
Documentation = "https://docs.iqm.tech/iqm-station-control-client/"
Homepage = "https://pypi.org/project/iqm-station-control-client/"

[project.optional-dependencies]
pin-iqm = [
    "iqm-exa-common==28.0.1",
    "iqm-pulse==14.0.1",
]
pin-all = [
    "annotated-types==0.7.0",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "colorama==0.4.6; sys_platform == 'win32'",
    "googleapis-common-protos==1.72.0",
    "grpcio==1.76.0",
    "idna==3.11",
    "importlib-metadata==7.1.0",
    "iqm-data-definitions==2.24",
    "iqm-exa-common==28.0.1",
    "iqm-pulse==14.0.1",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "numpy==2.3.5",
    "opentelemetry-api==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-exporter-otlp-proto-common==1.40.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.40.0",
    "opentelemetry-exporter-otlp-proto-http==1.40.0",
    "opentelemetry-proto==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-semantic-conventions==0.61b0",
    "optype==0.15.0",
    "packaging==24.2",
    "pandas==2.3.3",
    "protobuf==6.33.6",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-rapidjson==1.20",
    "pytz==2024.1",
    "pyyaml==6.0.2",
    "requests==2.32.3",
    "ruamel-yaml==0.17.32",
    "ruamel-yaml-clib==0.2.11; python_full_version < '3.12' and platform_python_implementation == 'CPython'",
    "scipy==1.17.0",
    "scipy-stubs==1.16.0.0",
    "six==1.16.0",
    "tqdm==4.67.2",
    "types-protobuf==6.32.1.20251210",
    "types-requests==2.32.4.20260107",
    "types-six==1.17.0.20251009",
    "types-tqdm==4.67.2.20260202",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "xarray==2024.10.0",
    "zipp==3.23.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/iqm",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    "changelog/",
    "pytest.ini",
    "mise.toml",
    "mise/",
    "docs/",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "daemon.*",
    "quimb.*",
    "qiskit.*",
    "qiskit_aer.*",
    "grpc.*",
    "lmfit.*",
    "emukit.*",
    "mockito.*",
    "sklearn.*",
    "dill.*",
    "uncertainties.*",
    "pythonjsonlogger.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "iqm.models.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.ruff]
exclude = [
    "*.ipynb",
    "*.rst",
]
extend-exclude = [
    "src/iqm/station_control/client/iqm_server/proto",
]
extend-include = [
    "sub-setup-py.template",
]
line-length = 120

[tool.ruff.lint]
ignore = [
    "D203",
    "D213",
]
select = [
    "E4",
    "E7",
    "E9",
    "E5",
    "F",
    "Q",
    "PL",
    "I",
    "D",
    "UP007",
    "UP006",
    "UP035",
    "ANN001",
    "ANN201",
    "ANN202",
    "NPY201",
    "PERF401",
    "PERF402",
    "PERF403",
]
unfixable = [
    "F401",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
    "exa.experiments",
    "exa.core",
    "exa.common",
    "iqm.cocos",
    "iqm.gbc",
    "iqm.calibration_graphs",
    "iqm.pulse",
    "iqm.cpc",
    "iqm.pulla",
    "iqm.station_control",
    "tests",
]
known-local-folder = [
    "src",
]
known-third-party = [
    "exa",
    "iqm",
]
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "D104",
    "F401",
    "PLR0402",
]
"**/docs/*" = [
    "E402",
    "D100",
]
"**/setup.py" = [
    "D100",
    "D103",
    "I001",
    "ANN201",
]
"**/src/*" = [
    "PLR2004",
    "D400",
    "D415",
    "D205",
    "D401",
    "D417",
    "D100",
    "D107",
    "D105",
    "D102",
    "D404",
]
"**/tests/*" = [
    "F632",
    "PLR2004",
    "PLR0402",
    "PLC0414",
    "D",
    "ANN001",
    "ANN201",
    "ANN202",
]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 16
max-locals = 21
max-returns = 9
max-statements = 60

[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.run]
branch = true
source = [
    "iqm.station_control",
]

[tool.pytest.ini_options]
nb_diff_ignore = [
    "/metadata/language_info",
    "/metadata/widgets",
    "/cells/*/execution_count",
    "/cells/*/outputs",
]
