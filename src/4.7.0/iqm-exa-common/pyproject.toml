[build-system]
requires = [
    "hatchling>=1,<2",
]
build-backend = "hatchling.build"

[project]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
description = "Framework for control and measurement of superconducting qubits: common library"
name = "iqm-exa-common"
readme = "build/README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "iqm-data-definitions",
    "jinja2<4,>=3.1.6",
    "numpy<3,>=2.2",
    "pydantic<2.13.0,>=2.12.4",
    "python-dotenv<2,>=1.0",
    "requests<3,>=2.32.3",
    "ruamel-yaml<0.20,>=0.17.32",
    "six<2,>=1.16.0",
    "types-requests",
    "types-six",
    "typing-extensions>=4.5.0",
    "xarray>=2024.10.0",
]
authors = [
    { name = "IQM Finland Oy", email = "info@iqm.tech" },
]
version = "29.0.0"

[project.optional-dependencies]
notebook = [
    "ipywidgets<9,>=8",
]
pin-iqm = [
    "iqm-data-definitions==3.1.0",
]
pin-all = [
    "annotated-types==0.7.0",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "idna==3.11",
    "iqm-data-definitions==3.1.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "numpy==2.3.5",
    "optype==0.15.0",
    "packaging==24.2",
    "pandas==2.3.3",
    "protobuf==6.33.6",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2024.1",
    "requests==2.32.3",
    "ruamel-yaml==0.17.32",
    "ruamel-yaml-clib==0.2.11; python_full_version < '3.12' and platform_python_implementation == 'CPython'",
    "scipy==1.17.0",
    "scipy-stubs==1.16.0.0",
    "six==1.16.0",
    "types-protobuf==6.32.1.20251210",
    "types-requests==2.32.4.20260107",
    "types-six==1.17.0.20251009",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "xarray==2024.10.0",
]
notebook-pin-iqm = [
    "ipywidgets<9,>=8",
    "iqm-data-definitions==3.1.0",
]
notebook-pin-all = [
    "annotated-types==0.7.0",
    "asttokens==3.0.1",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "colorama==0.4.6; sys_platform == 'win32'",
    "comm==0.2.3",
    "decorator==5.2.1",
    "executing==2.2.1",
    "idna==3.11",
    "ipython==8.21.0",
    "ipywidgets==8.1.8",
    "iqm-data-definitions==3.1.0",
    "jedi==0.18.2",
    "jinja2==3.1.6",
    "jupyterlab-widgets==3.0.16",
    "markupsafe==3.0.3",
    "matplotlib-inline==0.2.1",
    "numpy==2.3.5",
    "optype==0.15.0",
    "packaging==24.2",
    "pandas==2.3.3",
    "parso==0.8.5",
    "pexpect==4.9.0; sys_platform != 'win32'",
    "prompt-toolkit==3.0.52",
    "protobuf==6.33.6",
    "ptyprocess==0.7.0; sys_platform != 'win32'",
    "pure-eval==0.2.3",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2024.1",
    "requests==2.32.3",
    "ruamel-yaml==0.17.32",
    "ruamel-yaml-clib==0.2.11; python_full_version < '3.12' and platform_python_implementation == 'CPython'",
    "scipy==1.17.0",
    "scipy-stubs==1.16.0.0",
    "six==1.16.0",
    "stack-data==0.6.3",
    "traitlets==5.9.0",
    "types-protobuf==6.32.1.20251210",
    "types-requests==2.32.4.20260107",
    "types-six==1.17.0.20251009",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "tzdata==2025.3",
    "urllib3==2.6.3",
    "wcwidth==0.5.3",
    "widgetsnbextension==4.0.15",
    "xarray==2024.10.0",
]

[project.license]
file = "LICENSE.txt"

[project.urls]
Documentation = "https://docs.iqm.tech/iqm-exa-common/"
Homepage = "https://pypi.org/project/iqm-exa-common/"

[tool.hatch.build.targets.wheel]
packages = [
    "src/exa",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".gitignore",
    "tests/",
    "changelog/",
    "pytest.ini",
    "mise.toml",
    "mise/",
    "docs/",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "daemon.*",
    "quimb.*",
    "qiskit.*",
    "qiskit_aer.*",
    "grpc.*",
    "lmfit.*",
    "emukit.*",
    "mockito.*",
    "sklearn.*",
    "dill.*",
    "uncertainties.*",
    "pythonjsonlogger.*",
]
ignore_missing_imports = true

[tool.ruff]
exclude = [
    "*.ipynb",
    "*.rst",
]
extend-include = [
    "sub-setup-py.template",
]
line-length = 120

[tool.ruff.lint]
ignore = [
    "D203",
    "D213",
]
select = [
    "E4",
    "E7",
    "E9",
    "E5",
    "F",
    "Q",
    "PL",
    "I",
    "D",
    "UP007",
    "UP006",
    "UP035",
    "ANN001",
    "ANN201",
    "ANN202",
    "NPY",
    "PERF401",
    "PERF402",
    "PERF403",
    "PGH003",
    "C401",
    "C408",
    "C416",
    "C419",
    "C420",
    "N801",
    "B007",
    "SIM113",
    "SIM118",
]
unfixable = [
    "F401",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
    "exa.experiments",
    "exa.core",
    "exa.common",
    "iqm.cocos",
    "iqm.gbc",
    "iqm.calibration_graphs",
    "iqm.pulse",
    "iqm.cpc",
    "iqm.pulla",
    "iqm.station_control",
    "tests",
]
known-local-folder = [
    "src",
]
known-third-party = [
    "exa",
    "iqm",
]
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = [
    "D104",
    "PLR0402",
]
"docs/*" = [
    "E402",
    "D100",
]
"src/*" = [
    "PLR2004",
    "D400",
    "D415",
    "D205",
    "D401",
    "D417",
    "D100",
    "D107",
    "D105",
    "D102",
    "D404",
]
"tests/*" = [
    "F632",
    "PLR2004",
    "PLR0402",
    "PLC0414",
    "D",
    "ANN001",
    "ANN201",
    "ANN202",
]

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 16
max-locals = 21
max-returns = 9
max-statements = 60

[tool.coverage.paths]
source = [
    "src/",
    "*/site-packages/",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.run]
branch = true
source = [
    "exa.common",
]

[tool.pytest.ini_options]
nb_diff_ignore = [
    "/metadata/language_info",
    "/metadata/widgets",
    "/cells/*/execution_count",
    "/cells/*/outputs",
]
