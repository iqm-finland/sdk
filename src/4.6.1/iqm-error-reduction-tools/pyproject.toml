[build-system]
requires = [
    "hatchling>=1,<2",
]
build-backend = "hatchling.build"

[project]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
description = "Client library for error reduction on IQM quantum computers."
name = "iqm-error-reduction-tools"
readme = "build/README.md"
license-files = [
    "LICENSE.txt",
]
requires-python = ">=3.11, <3.15"
dependencies = [
    "iqm-client[qiskit]",
    "iqm-pulla",
    "iqm-pulse",
    "matplotlib<4,>=3.9",
    "mthree<4,>=3",
    "numpy<3.0,>=2.0",
    "qiskit<2.2,>=2.0",
    "qrisp<0.10,>=0.9.5",
    "rustworkx<0.18,>=0.17",
    "seaborn<0.14,>=0.13.2",
]
authors = [
    { name = "IQM Finland Oy", email = "developers@iqm.tech" },
]
version = "0.2.2"

